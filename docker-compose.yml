services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: gatekeeper_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gatekeeper
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gatekeeper_app -d gatekeeper"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://gatekeeper_app:${POSTGRES_PASSWORD}@db:5432/gatekeeper
      TEST_DATABASE_URL: postgresql://gatekeeper_app:${POSTGRES_PASSWORD}@db:5432/gatekeeper_test
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data: